version = "1.0"

[task]
name = "apollo/commitments-tracking"
description = "Track unrecorded workplace commitments from Slack messages without duplicating existing tasks."

[metadata]
author = "gianm"
difficulty = "medium"
expert_time_estimate_hours = 0.25
category = "knowledge-work"
tags = ["slack", "tasks", "commitments"]

[verifier]
timeout_sec = 180.0
env = { OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}" }

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
env = { WORKSPACE_STATE = "/workspace/state.json" }
